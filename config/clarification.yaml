# ============================================================================
# Clarification（反问机制）配置 —— 决策 9-15
# ============================================================================
# 控制 TaskPlanner / DialogManager 的行为。
# 加载入口：src/clarification/config.py 的 load_clarification_config()
# ============================================================================

# task_planner 整体开关。
# false 时 task_planner 退化为直接 EXECUTE 单意图（跳过 LLM 裁决，不触发反问）。
enabled: true

# 反问轮次硬上限（决策 13）。达到后不再 interrupt，用最佳猜测继续或拒答。
max_clarify_rounds: 5

# 拒答关键词（决策 13）。用户回答包含任一关键词即识别为拒答，立即退出反问循环。
decline_keywords:
  - "不知道"
  - "跳过"
  - "算了"
  - "skip"
  - "不清楚"
  - "随便"
